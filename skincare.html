<!DOCTYPE html>
<html lang="zh-CN" data-theme="blue">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="护肤消费">
<meta name="theme-color" content="#EEF3F8">
<title>护肤消费</title>
<style>
:root{
  --ink:#3A3630; --ink2:#4A443C; --muted:#5C574E;
  --accent:#703D2D; --line:#D8CCB8; --border:#E4DCCF;
  --paper:#FFFFFF; --bg:#F6F2EA; --soft:#FBF8F2;
  --ok:#5E7050; --ph:#B7AC97; --chk:#B8A88A; --warn:#A33B22;
  --badgeA:#F3E4DE; --badgeB:#E7EDE2; --badgeC:#EDEAE4;
}
html[data-theme="blue"]{
  --ink:#2F3A46; --ink2:#42505D; --muted:#61707F;
  --accent:#2C5F92; --line:#BCCFE2; --border:#D2DFEC;
  --paper:#FFFFFF; --bg:#EEF3F8; --soft:#F5F9FD;
  --ok:#4A7358; --ph:#9FB0C0; --chk:#9DB2C6; --warn:#A8452E;
  --badgeA:#DFE9F3; --badgeB:#E3EEE6; --badgeC:#E8EBEF;
}
html[data-theme="green"]{
  --ink:#2E3A2E; --ink2:#42533F; --muted:#5F7060;
  --accent:#3F6B45; --line:#B6CDAE; --border:#CEDDC8;
  --paper:#FFFFFF; --bg:#EDF3EC; --soft:#F5FAF4;
  --ok:#4A7358; --ph:#A3B69D; --chk:#A2BCA0; --warn:#A8452E;
  --badgeA:#E2EDE1; --badgeB:#E7EDE2; --badgeC:#EDEAE4;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Songti SC","STSongti-SC-Regular","Noto Serif SC","Songti TC",serif;
  padding:12px 14px calc(28px + env(safe-area-inset-bottom));
  max-width:520px; margin:0 auto; -webkit-font-smoothing:antialiased;
}
.head{text-align:center; padding:6px 0 2px;}
.head .kicker{font-size:12px; letter-spacing:.35em; color:var(--muted);}
.head h1{font-size:24px; margin:6px 0 2px; font-weight:700; letter-spacing:.12em;}
.head .sub{font-size:13px; color:var(--muted); line-height:1.7;}
.card{background:var(--paper); border:1.5px solid var(--border); border-radius:14px; padding:18px 16px 16px; margin-top:12px;}
.sec{margin-top:14px;} .sec:first-child{margin-top:0;}
label.lab{display:block; font-size:13px; color:var(--ink2); margin:0 0 6px 2px;}
input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%; font-size:16px; font-family:inherit; color:var(--ink);
  background:var(--soft); border:none; border-bottom:1.5px solid var(--line);
  border-radius:6px 6px 0 0; padding:9px 10px 8px; outline:none;
  -webkit-appearance:none; appearance:none;
}
input:focus,select:focus,textarea:focus{border-bottom-color:var(--accent); background:#fff;}
input::placeholder,textarea::placeholder{color:var(--ph);}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
.yuan{position:relative;} .yuan input{padding-left:30px;}
.yuan .sym{position:absolute; left:10px; bottom:9px; font-size:16px; color:var(--muted);}
.yuan.big input{font-size:28px; font-weight:700; padding:6px 30px 6px 34px;}
.yuan.big .sym{font-size:22px; bottom:8px;}
/* 日期切换 */
.dateBar{display:flex; align-items:center; gap:10px;}
.dateBar button{
  flex:0 0 46px; font-family:inherit; font-size:18px; padding:8px 0; border-radius:9px;
  border:1.5px solid var(--line); background:var(--soft); color:var(--ink2);
}
.dateBar input{flex:1; text-align:center;}
.dateBar .today{flex:0 0 auto; font-family:inherit; font-size:12.5px; padding:9px 12px; border-radius:9px;
  border:1.5px solid var(--line); background:var(--soft); color:var(--ink2);}
/* 分类 */
.cats{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
.cats button{font-family:inherit; font-size:14.5px; padding:11px 3px; border-radius:9px;
  border:1.5px solid var(--line); background:var(--soft); color:var(--ink2);}
.cats button.on{background:var(--accent); border-color:var(--accent); color:#fff;}
/* 照片 */
.phBox{display:flex; gap:12px; align-items:flex-start;}
.phPrev{
  flex:0 0 96px; width:96px; height:96px; border-radius:10px; border:1.5px dashed var(--line);
  background:var(--soft); display:flex; align-items:center; justify-content:center; overflow:hidden;
  color:var(--ph); font-size:11.5px; text-align:center; line-height:1.5;
}
.phPrev img{width:100%; height:100%; object-fit:cover; display:block;}
.phBtns{flex:1; display:flex; flex-direction:column; gap:8px;}
.phBtns button{
  font-family:inherit; font-size:14px; padding:9px 12px; border-radius:9px;
  border:1.5px solid var(--line); background:var(--soft); color:var(--ink2); width:100%;
}
.hintline{font-size:11.5px; color:var(--ph); line-height:1.6; margin-top:6px;}
.item .ph{flex:0 0 44px; width:44px; height:44px; border-radius:8px; overflow:hidden;
  border:1px solid var(--border); background:var(--soft);}
.item .ph img{width:100%; height:100%; object-fit:cover; display:block;}
/* 合计 */
.total{margin-top:14px; background:var(--soft); border:1px solid var(--border); border-radius:12px; padding:14px 14px 10px;}
.total .lab2{font-size:12.5px; color:var(--muted); letter-spacing:.15em;}
.total .num{font-size:36px; font-weight:700; color:var(--accent); line-height:1.3; margin-top:2px;}
.total .cnt{font-size:12px; color:var(--muted);}
/* 三格汇总 */
.trio{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:12px;}
.trio .box{background:var(--soft); border:1px solid var(--border); border-radius:12px; padding:11px 10px 9px; text-align:center;}
.trio .box .k{font-size:11.5px; color:var(--muted);}
.trio .box .v{font-size:19px; font-weight:700; color:var(--accent); margin-top:3px; font-variant-numeric:tabular-nums;}
/* 分类小计 */
.bars{margin-top:12px;}
.bar{display:flex; align-items:center; gap:10px; padding:5px 0; font-size:13px;}
.bar .n{flex:0 0 52px; color:var(--ink2);}
.bar .t{flex:1; height:8px; background:var(--paper); border:1px solid var(--border); border-radius:6px; overflow:hidden;}
.bar .t i{display:block; height:100%; background:var(--accent); opacity:.75;}
.bar .v{flex:0 0 auto; color:var(--ink); font-variant-numeric:tabular-nums;}
.actions{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px;}
.actions button{font-family:inherit; font-size:15px; letter-spacing:.06em; padding:12px 6px; border-radius:10px; border:1.5px solid var(--accent);}
#btnSave{background:var(--accent); color:#fff;}
#btnClear{background:#fff; color:var(--accent);}
/* 月度切换 */
.monBar{display:flex; align-items:center; gap:10px;}
.monBar button{flex:0 0 46px; font-family:inherit; font-size:18px; padding:8px 0; border-radius:9px;
  border:1.5px solid var(--line); background:var(--soft); color:var(--ink2);}
.monBar .mLab{flex:1; text-align:center; font-size:17px; letter-spacing:.08em; color:var(--ink);}
.monBar .thisMon{flex:0 0 auto; font-family:inherit; font-size:12.5px; padding:9px 12px; border-radius:9px;
  border:1.5px solid var(--line); background:var(--soft); color:var(--ink2);}
.cmp{margin-top:12px; font-size:12.5px; color:var(--muted); line-height:1.8;}
/* 列表 */
.listTitle{display:flex; justify-content:space-between; align-items:center; margin-top:18px; font-size:14px; color:var(--ink2); letter-spacing:.1em;}
.listTitle .c{font-size:12.5px; color:var(--muted);}
.item{display:flex; gap:12px; padding:12px 0; border-bottom:1px dashed var(--border); align-items:flex-start;}
.item .time{flex:0 0 52px; font-size:13px; color:var(--muted); padding-top:2px; font-variant-numeric:tabular-nums;}
.item .info{flex:1; min-width:0;}
.item .info .n{font-size:15px; color:var(--ink);}
.item .info .n i{font-style:normal; font-size:11.5px; color:var(--accent); background:var(--badgeA);
  padding:2px 7px; border-radius:20px; margin-right:7px;}
.item .info .m{font-size:11.5px; color:var(--muted); margin-top:4px; line-height:1.7;}
.item .amt{flex:0 0 auto; font-size:18px; font-weight:700; color:var(--accent); font-variant-numeric:tabular-nums;}
.item .del{flex:0 0 auto; font-family:inherit; font-size:11.5px; padding:5px 8px; border-radius:7px;
  border:1px solid var(--border); background:#fff; color:var(--ph);}
.empty{font-size:12.5px; color:var(--ph); padding:14px 2px; text-align:center;}
.quote{text-align:center; font-size:12.5px; color:var(--muted); margin:16px 0 2px;}
.nav{display:flex; justify-content:center; gap:14px; flex-wrap:wrap; margin-top:6px;}
.nav a{font-size:14px; color:var(--accent); text-decoration:none; padding:9px 14px;
  border:1px solid var(--border); border-radius:22px; background:var(--paper);
  font-family:inherit; letter-spacing:.02em; -webkit-tap-highlight-color:transparent;}
.nav a:active{background:var(--soft);}
/* 预览层 */
#ov{position:fixed; inset:0; background:rgba(40,35,28,.72); z-index:50; display:none; flex-direction:column;
  align-items:center; justify-content:center; padding:18px;}
#ov.show{display:flex;}
#ov img{max-width:100%; max-height:62vh; border-radius:10px; box-shadow:0 8px 30px rgba(0,0,0,.4);}
#ov .tip{color:#F1E9DA; font-size:13px; margin:12px 0 10px; text-align:center; line-height:1.7;}
#ov .row{display:flex; gap:10px;}
#ov button{font-family:inherit; font-size:14px; padding:10px 18px; border-radius:9px; border:none;}
#ovShare{background:#fff; color:var(--ink);}
#ovClose{background:transparent; color:#F1E9DA; border:1px solid #8C8272 !important;}
.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:34px; background:rgba(58,54,48,.92); color:#F6F2EA;
  font-size:13px; padding:10px 16px; border-radius:9px; opacity:0; transition:opacity .25s; z-index:99; pointer-events:none;}
.toast.show{opacity:1;}
</style>
</head>

<script>
"use strict";
var LS="calme_skincare_v1";
var SPEND_LS="calme_spend_v1";
var $=function(id){return document.getElementById(id);};
function load(){try{var s=JSON.parse(localStorage.getItem(LS));if(s&&s.items)return s;}catch(e){}return {items:[]};}
function save(){
  try{ localStorage.setItem(LS,JSON.stringify(D)); return true; }
  catch(e){ toast("手机存储空间满了 · 去「数据备份」导出后删掉一些旧照片再试"); return false; }
}
var D=load();

/* ---------- 配色 ---------- */
var THEMES={
  warm:{bg:"#F6F2EA",paper:"#FFFFFF",border:"#E4DCCF",line:"#D8CCB8",
        ink:"#3A3630",ink2:"#4A443C",muted:"#5C574E",accent:"#703D2D",chk:"#B8A88A",ph:"#C9BFA9"},
  blue:{bg:"#EEF3F8",paper:"#FFFFFF",border:"#D2DFEC",line:"#BCCFE2",
        ink:"#2F3A46",ink2:"#42505D",muted:"#61707F",accent:"#2C5F92",chk:"#9DB2C6",ph:"#A8B8C7"},
  green:{bg:"#EDF3EC",paper:"#FFFFFF",border:"#CEDDC8",line:"#B6CDAE",
        ink:"#2E3A2E",ink2:"#42533F",muted:"#5F7060",accent:"#3F6B45",chk:"#A2BCA0",ph:"#A8BCA2"}
};
var TH="blue";
function applyTheme(t){
  TH=t; try{localStorage.setItem("calme_theme2",t);}catch(e){}
  document.documentElement.setAttribute("data-theme",t==="warm"?"":t);
}

var CATS=["洁面","水","精华","面霜","防晒","面膜","彩妆","洗护","其他"];
var cur={date:"",cat:"精华",brand:"",name:"",amt:"",ch:"",note:"",photo:""};
function today(){var d=new Date(),p=function(n){return (n<10?"0":"")+n;};return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());}
function num(v){var n=parseFloat(v);return isNaN(n)?0:n;}
function fmt(n){var v=Math.round(n*100)/100;return v.toLocaleString("zh-CN");}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function shiftDate(s,n){var a=s.split("-"),d=new Date(+a[0],+a[1]-1,+a[2]);d.setDate(d.getDate()+n);
  var p=function(x){return (x<10?"0":"")+x;};return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());}
function pad2(x){return (x<10?"0":"")+x;}
function shiftMon(m,n){var a=m.split("-"),d=new Date(+a[0],+a[1]-1+n,1);return d.getFullYear()+"-"+pad2(d.getMonth()+1);}
function toast(t){var el=$("toast");el.textContent=t;el.classList.add("show");setTimeout(function(){el.classList.remove("show");},1800);}

/* ---------- 从「当日消费」把美妆护肤记录搬过来（只搬一次） ---------- */
var MIG_FLAG="calme_skincare_migrated_v1";
function guessCat(s){
  s=String(s||"");
  var M=[["洁面","洁面"],["洗面","洁面"],["水","水"],["爽肤","水"],["喷雾","水"],
         ["精华","精华"],["眼霜","精华"],["原液","精华"],["肌底","精华"],
         ["面霜","面霜"],["乳液","面霜"],["乳","面霜"],["霜","面霜"],
         ["防晒","防晒"],["隔离","防晒"],
         ["面膜","面膜"],["唇","彩妆"],["口红","彩妆"],["粉底","彩妆"],["气垫","彩妆"],["眼影","彩妆"],["眉","彩妆"],["腮红","彩妆"],
         ["洗发","洗护"],["沐浴","洗护"],["身体乳","洗护"],["护手","洗护"],["牙膏","洗护"]];
  for(var i=0;i<M.length;i++){ if(s.indexOf(M[i][0])>=0) return M[i][1]; }
  return "其他";
}
function migrateFromSpend(){
  var sp=null;
  try{ sp=JSON.parse(localStorage.getItem(SPEND_LS)); }catch(e){}
  if(!sp||!sp.items||!sp.items.length)return 0;
  var movers=sp.items.filter(function(it){return it.cat==="美妆护肤";});
  if(!movers.length)return 0;

  /* 先留一份原始备份，万一要找回 */
  try{ localStorage.setItem("calme_spend_bak_skincare_v1",JSON.stringify(sp)); }catch(e){}

  var had={};
  D.items.forEach(function(it){ if(it.src)had[it.src]=1; });
  var added=0;
  movers.forEach(function(it){
    var src="spend:"+it.id;
    if(had[src])return;
    D.items.push({
      id:it.id, src:src, date:it.date||today(), cat:guessCat(it.note), brand:"",
      name:it.note||"护肤品", amt:it.amt||0, ch:"", note:"", photo:it.photo||""
    });
    added++;
  });
  if(added) save();
  sp.items=sp.items.filter(function(it){return it.cat!=="美妆护肤";});
  try{ localStorage.setItem(SPEND_LS,JSON.stringify(sp)); }catch(e){}
  try{ localStorage.setItem(MIG_FLAG,"1"); }catch(e){}
  return added;
}

/* ---------- 数据 ---------- */
function monItems(m){return D.items.filter(function(it){return (it.date||"").slice(0,7)===m;});}
function statOf(list){
  var sum=0,byCat={},days={};
  list.forEach(function(it){
    sum+=num(it.amt);
    byCat[it.cat]=(byCat[it.cat]||0)+num(it.amt);
    if(it.date)days[it.date]=1;
  });
  return {sum:sum,n:list.length,byCat:byCat,days:Object.keys(days).length};
}
function allStat(){return statOf(D.items);}
function firstDateOf(list){
  if(!list.length)return "";
  return list.map(function(it){return it.date||"";}).filter(Boolean).sort()[0];
}

/* ---------- 照片 ---------- */
var phInput=$("phFile");
$("btnPhPick").addEventListener("click",function(){phInput.removeAttribute("capture");phInput.click();});
$("btnPhCam").addEventListener("click",function(){phInput.setAttribute("capture","environment");phInput.click();});
$("btnPhDel").addEventListener("click",function(){
  if(!cur.photo){toast("还没有照片");return;}
  cur.photo=""; renderPhoto();
});
phInput.addEventListener("change",function(e){
  var f=e.target.files&&e.target.files[0]; if(!f)return;
  var fr=new FileReader();
  fr.onload=function(ev){
    var im=new Image();
    im.onload=function(){
      var max=800,w=im.width,h=im.height;
      if(w>h&&w>max){h=Math.round(h*max/w);w=max;}else if(h>=w&&h>max){w=Math.round(w*max/h);h=max;}
      var cv=document.createElement("canvas"); cv.width=w; cv.height=h;
      cv.getContext("2d").drawImage(im,0,0,w,h);
      cur.photo=cv.toDataURL("image/jpeg",0.75);
      renderPhoto();
    };
    im.src=ev.target.result;
  };
  fr.readAsDataURL(f);
  e.target.value="";
});
function renderPhoto(){
  var p=$("phPrev");
  p.innerHTML=cur.photo?'<img src="'+cur.photo+'" alt="照片">':"<span>无照片</span>";
}

/* ---------- 输入 ---------- */
var curMon=today().slice(0,7);
cur.date=today();
$("fDate").value=cur.date;
$("fDate").addEventListener("change",function(){cur.date=$("fDate").value;});
$("prevDay").addEventListener("click",function(){cur.date=shiftDate(cur.date,-1);$("fDate").value=cur.date;});
$("nextDay").addEventListener("click",function(){cur.date=shiftDate(cur.date,1);$("fDate").value=cur.date;});
$("btnToday").addEventListener("click",function(){cur.date=today();$("fDate").value=cur.date;});
$("prevMon").addEventListener("click",function(){curMon=shiftMon(curMon,-1);render();});
$("nextMon").addEventListener("click",function(){curMon=shiftMon(curMon,1);render();});
$("btnThisMon").addEventListener("click",function(){curMon=today().slice(0,7);render();});
$("fBrand").addEventListener("input",function(){cur.brand=$("fBrand").value;});
$("fName").addEventListener("input",function(){cur.name=$("fName").value;});
$("fAmt").addEventListener("input",function(){cur.amt=$("fAmt").value;});
$("fCh").addEventListener("input",function(){cur.ch=$("fCh").value;});
$("fNote").addEventListener("input",function(){cur.note=$("fNote").value;});
$("cats").addEventListener("click",function(e){
  var b=e.target.closest("button"); if(!b)return; cur.cat=b.dataset.v; renderPicker();
});
function renderPicker(){
  document.querySelectorAll("#cats button").forEach(function(b){b.classList.toggle("on",b.dataset.v===cur.cat);});
}

/* ---------- 保存 ---------- */
$("btnSave").addEventListener("click",function(){
  var nm=(cur.name||"").trim();
  if(!nm){toast("先写个品名");$("fName").focus();return;}
  var a=num(cur.amt);
  D.items.push({id:Date.now(),date:cur.date,cat:cur.cat,brand:(cur.brand||"").trim(),name:nm,
                amt:a,ch:cur.ch||"",note:cur.note||"",photo:cur.photo||""});
  if(!save()){ D.items.pop(); render(); return; }
  cur.brand=""; cur.name=""; cur.amt=""; cur.note=""; cur.photo="";
  $("fBrand").value=""; $("fName").value=""; $("fAmt").value=""; $("fNote").value="";
  render(); renderPhoto(); renderPicker();
  toast("已记 "+cur.cat+" ¥"+fmt(a));
});
$("btnClear").addEventListener("click",function(){
  cur.brand=""; cur.name=""; cur.amt=""; cur.note=""; cur.photo="";
  $("fBrand").value=""; $("fName").value=""; $("fAmt").value=""; $("fNote").value="";
  renderPhoto(); renderPicker();
});

/* ---------- 渲染 ---------- */
function render(){
  renderPicker();
  $("monLabel").textContent=curMon.split("-")[0]+" 年 "+(+curMon.split("-")[1])+" 月";

  var mine=monItems(curMon), st=statOf(mine), aS=allStat();
  $("monSum").textContent="¥"+fmt(st.sum);
  var avg=st.n?st.sum/st.n:0;
  $("monCnt").textContent=st.n
    ? ("共 "+st.n+" 件 · 平均 ¥"+fmt(avg)+" / 件")
    : (curMon+" 还没有记录");

  $("trio").innerHTML=
    '<div class="box"><div class="k">本月件数</div><div class="v">'+st.n+'</div></div>'+
    '<div class="box"><div class="k">累计花费</div><div class="v">¥'+fmt(aS.sum)+'</div></div>'+
    '<div class="box"><div class="k">累计件数</div><div class="v">'+aS.n+'</div></div>';

  var keys=Object.keys(st.byCat).sort(function(a,b){return st.byCat[b]-st.byCat[a];});
  $("monBars").innerHTML=keys.length?keys.map(function(c){
    var pct=st.sum?Math.round(st.byCat[c]/st.sum*100):0;
    return '<div class="bar"><span class="n">'+c+'</span>'+
      '<span class="t"><i style="width:'+pct+'%"></i></span>'+
      '<span class="v">¥'+fmt(st.byCat[c])+'　'+pct+'%</span></div>';
  }).join(""):'<div class="empty" style="padding:4px 2px;">这个月还没有品类数据</div>';

  var pm=shiftMon(curMon,-1), ps=statOf(monItems(pm));
  var el=$("monCmp");
  if(!ps.sum&&!st.sum){ el.innerHTML=""; }
  else if(!ps.sum){ el.innerHTML="上月（"+pm+"）没有记录，没法对比。"; }
  else{
    var diff=st.sum-ps.sum, sign=diff>=0?"多":"少";
    el.innerHTML='上月 ¥'+fmt(ps.sum)+' ・ 本月 '+sign+' ¥'+fmt(Math.abs(diff))+
      '（'+(diff>=0?"+":"-")+Math.abs(Math.round(diff/ps.sum*100))+'%）';
  }

  var list=mine.slice().sort(function(a,b){return (b.date||"").localeCompare(a.date||"");});
  $("listCount").textContent=list.length?("共 "+list.length+" 件"):"";
  var L=$("list");
  if(!list.length){
    L.innerHTML='<div class="empty">这个月还没有记录。买一瓶就记一笔，年底一翻很踏实。</div>';
    return;
  }
  L.innerHTML=list.map(function(it){
    var meta=[];
    if(it.ch)meta.push(it.ch);
    if(it.note)meta.push(it.note);
    return '<div class="item">'+
      '<span class="time">'+esc((it.date||"").slice(5))+'</span>'+
      (it.photo?'<span class="ph"><img src="'+it.photo+'" alt=""></span>':'')+
      '<div class="info">'+
        '<div class="n"><i>'+esc(it.cat)+'</i>'+esc((it.brand?it.brand+" · ":"")+it.name)+'</div>'+
        (meta.length?'<div class="m">'+esc(meta.join(" · "))+'</div>':'')+
      '</div>'+
      '<span class="amt">¥'+fmt(it.amt)+'</span>'+
      '<button class="del" data-id="'+it.id+'">删</button>'+
    '</div>';
  }).join("");
}
$("list").addEventListener("click",function(e){
  var b=e.target.closest("button.del"); if(!b)return;
  if(!confirm("删除这一笔？"))return;
  var id=+b.dataset.id, i=-1;
  D.items.forEach(function(it,k){if(it.id===id)i=k;});
  if(i>=0){D.items.splice(i,1);save();render();}
});

/* ---------- 文字版 ---------- */
function textOf(){
  var mine=monItems(curMon), st=statOf(mine), aS=allStat();
  var L=[];
  L.push("护肤消费 · "+curMon);
  L.push("本月 ¥"+fmt(st.sum)+"（"+st.n+" 件"+(st.n?" · 平均 ¥"+fmt(st.sum/st.n):"")+"）");
  var keys=Object.keys(st.byCat).sort(function(a,b){return st.byCat[b]-st.byCat[a];});
  if(keys.length){
    L.push("—— 品类 ——");
    keys.forEach(function(c){L.push(c+" ¥"+fmt(st.byCat[c]));});
  }
  if(mine.length){
    L.push("—— 明细 ——");
    mine.slice().sort(function(a,b){return (a.date||"").localeCompare(b.date||"");}).forEach(function(it){
      var extra=[]; if(it.ch)extra.push(it.ch);
      L.push((it.date||"").slice(5)+" "+it.cat+" "+(it.brand?it.brand+" ":"")+it.name+" ¥"+fmt(it.amt)+
             (extra.length?"（"+extra.join(" · ")+"）":""));
    });
  }
  var fd=firstDateOf(D.items);
  L.push("—— 累计 ——");
  L.push("累计 ¥"+fmt(aS.sum)+"（共 "+aS.n+" 件"+((fd)?"，自 "+fd+" 起":"")+"）");
  return L.join("\n");
}

/* ---------- 生成图片 ---------- */
function loadImg(src){return new Promise(function(res,rej){var im=new Image();im.onload=function(){res(im);};im.onerror=rej;im.src=src;});}
function drawCover(x,im,dx,dy,dw,dh){
  var r=Math.max(dw/im.width,dh/im.height), sw=dw/r, sh=dh/r;
  var sx=(im.width-sw)/2, sy=(im.height-sh)/2;
  x.save(); rrect(x,dx,dy,dw,dh,10); x.clip();
  x.drawImage(im,sx,sy,sw,sh,dx,dy,dw,dh); x.restore();
}
function exportDay(){
  var items=monItems(curMon).slice().sort(function(a,b){return (a.date||"").localeCompare(b.date||"");});
  var phItems=items.slice(0,14).filter(function(it){return it.photo;}).slice(0,6);
  if(!phItems.length){ exportImg([]); return; }
  Promise.all(phItems.map(function(it){
    return loadImg(it.photo).then(function(im){return {im:im,it:it};}).catch(function(){return null;});
  })).then(function(l){ exportImg(l.filter(Boolean)); });
}
function exportImg(IMGS){
  IMGS=IMGS||[];
  var items=monItems(curMon).slice().sort(function(a,b){return (a.date||"").localeCompare(b.date||"");});
  var st=statOf(items), aS=allStat();
  var keys=Object.keys(st.byCat).sort(function(a,b){return st.byCat[b]-st.byCat[a];});
  var rows=items.slice(0,14), extra=items.length-rows.length;
  var first=firstDateOf(D.items);

  var W=1080, CX=60, CY=60, M=CX+44, IW=W-M*2;
  var SER='"Songti SC","STSongti-SC-Regular","Noto Serif SC",serif';
  var cvm=document.createElement("canvas"); cvm.width=10; cvm.height=10;
  var mx=cvm.getContext("2d");
  var names=rows.map(function(it){
    var t=(it.brand?it.brand+" · ":"")+it.name;
    mx.font="28px "+SER;
    return wrap(mx,t,"28px "+SER,IW-96-240).slice(0,1)[0]||"";
  });
  var subs=rows.map(function(it){
    var a=[];
    if(it.ch)a.push(it.ch);
    if(it.note)a.push(it.note);
    return wrap(mx,a.join(" · "),"26px "+SER,IW-96).slice(0,2);
  });
  var PER=5, PS=160, PGAP=14;
  var phRows=IMGS.length?Math.ceil(IMGS.length/PER):0;
  var P0=THEMES[TH]||THEMES.blue;
  var ink=P0.ink, mut=P0.muted, acc=P0.accent, line=P0.line, brd=P0.border;

  function paint(x,H,withFooter){
  var CW=W-120, CH=H-120;
  x.fillStyle=P0.bg; x.fillRect(0,0,W,H);
  x.save();
  x.shadowColor="rgba(0,0,0,.10)"; x.shadowBlur=24; x.shadowOffsetY=6;
  x.fillStyle="#FFFFFF"; rrect(x,CX,CY,CW,CH,24); x.fill();
  x.restore();
  x.strokeStyle=brd; x.lineWidth=2; rrect(x,CX,CY,CW,CH,24); x.stroke();

  var y=CY+104;
  x.fillStyle=ink; x.font="700 52px "+SER; x.textAlign="center"; x.fillText("护 肤 消 费",W/2,y); x.textAlign="left";
  y+=50;
  x.fillStyle=mut; x.font="26px "+SER; x.textAlign="center";
  x.fillText(curMon.split("-")[0]+" 年 "+(+curMon.split("-")[1])+" 月",W/2,y); x.textAlign="left";
  y+=64;

  x.fillStyle=mut; x.font="24px "+SER; x.textAlign="center"; x.fillText("本 月 护 肤 花 费",W/2,y); x.textAlign="left";
  y+=62;
  x.fillStyle=acc; x.font="700 84px "+SER; x.textAlign="center"; x.fillText("¥ "+fmt(st.sum),W/2,y); x.textAlign="left";
  y+=42;
  x.fillStyle=mut; x.font="24px "+SER; x.textAlign="center";
  x.fillText(items.length?("共 "+items.length+" 件 · 平均 ¥"+fmt(st.sum/items.length)+" / 件"):"这个月还没有记录",W/2,y);
  x.textAlign="left";
  y+=52;
  x.strokeStyle=line; x.lineWidth=2; x.beginPath(); x.moveTo(M,y); x.lineTo(M+IW,y); x.stroke();
  y+=52;

  if(keys.length){
    keys.forEach(function(c){
      var pct=st.sum?st.byCat[c]/st.sum:0;
      x.fillStyle=ink; x.font="28px "+SER; x.fillText(c,M,y);
      x.fillStyle=mut; x.font="26px "+SER;
      var vs="¥"+fmt(st.byCat[c])+"　"+Math.round(pct*100)+"%";
      x.textAlign="right"; x.fillText(vs,M+IW,y); x.textAlign="left";
      var bw=x.measureText(c).width, vw=x.measureText(vs).width;
      var bx=M+bw+24, bwid=IW-bw-vw-48, by=y-16;
      x.fillStyle="#FFFFFF"; rrect(x,bx,by,bwid,14,7); x.fill();
      x.strokeStyle=brd; x.lineWidth=1.5; rrect(x,bx,by,bwid,14,7); x.stroke();
      if(pct>0){ x.fillStyle=acc; x.globalAlpha=.72; rrect(x,bx,by,Math.max(14,bwid*pct),14,7); x.fill(); x.globalAlpha=1; }
      y+=62;
    });
    y+=10;
    x.strokeStyle=line; x.lineWidth=2; x.beginPath(); x.moveTo(M,y); x.lineTo(M+IW,y); x.stroke();
    y+=54;
  }

  rows.forEach(function(it,ri){
    x.fillStyle=mut; x.font="24px "+SER; x.fillText((it.date||"").slice(5),M,y);
    var tag="["+it.cat+"] ";
    x.fillStyle=acc; x.font="28px "+SER; x.fillText(tag,M+96,y);
    var tw=x.measureText(tag).width;
    x.fillStyle=ink; x.fillText(names[ri]||"",M+96+tw,y);
    x.font="700 30px "+SER; x.textAlign="right";
    x.fillText("¥"+fmt(it.amt),M+IW,y); x.textAlign="left";
    var sl=subs[ri]||[];
    sl.forEach(function(ln,j){
      x.fillStyle=mut; x.font="26px "+SER; x.fillText(ln,M+96,y+40+j*36);
    });
    y+=66+(sl.length?sl.length*36:0);
  });
  if(extra>0){
    x.fillStyle=P0.ph; x.font="24px "+SER; x.textAlign="center";
    x.fillText("…… 其余 "+extra+" 件未显示",W/2,y); x.textAlign="left"; y+=50;
  }
  if(!rows.length){
    x.fillStyle=P0.ph; x.font="28px "+SER; x.textAlign="center";
    x.fillText("这个月还没有记录",W/2,y+40); x.textAlign="left"; y+=100;
  }

  y+=6;
  x.strokeStyle=line; x.lineWidth=2; x.beginPath(); x.moveTo(M,y); x.lineTo(M+IW,y); x.stroke();
  y+=54;
  x.fillStyle=mut; x.font="26px "+SER; x.textAlign="center";
  x.fillText("累计 ¥"+fmt(aS.sum)+"（共 "+aS.n+" 件"+(first?"，自 "+first+" 起":"")+"）",W/2,y);
  x.textAlign="left";
  y+=30;

  if(phRows){
    y+=10;
    x.strokeStyle=line; x.lineWidth=2; x.beginPath(); x.moveTo(M,y); x.lineTo(M+IW,y); x.stroke();
    y+=54;
    x.fillStyle=mut; x.font="24px "+SER; x.textAlign="center"; x.fillText("本 月 照 片",W/2,y); x.textAlign="left";
    y+=42;
    IMGS.forEach(function(o,i){
      var r=Math.floor(i/PER), c=i%PER;
      var px=M+c*(PS+PGAP), py=y+r*(PS+26+16);
      drawCover(x,o.im,px,py,PS,PS);
      x.strokeStyle=brd; x.lineWidth=1.5; rrect(x,px,py,PS,PS,10); x.stroke();
      x.fillStyle=mut; x.font="20px "+SER;
      x.fillText((o.it.date||"").slice(5)+"　"+o.it.cat,px,py+PS+22);
    });
    y += phRows*(PS+26+16);
  }

  if(withFooter){
    x.fillStyle=P0.ph; x.font="22px "+SER; x.textAlign="center";
    x.fillText("Calme · 护肤消费　"+curMon,W/2,H-CY-40); x.textAlign="left";
  }
  return y;
  }

  var probe=document.createElement("canvas"); probe.width=W; probe.height=4200;
  var endY=paint(probe.getContext("2d"),4200,false);
  var H=Math.max(1080, endY+150);
  var cv=document.createElement("canvas"); cv.width=W; cv.height=H;
  paint(cv.getContext("2d"),H,true);

  lastBlob=null;
  cv.toBlob(function(b){ lastBlob=b; $("ovImg").src=URL.createObjectURL(b); $("ov").classList.add("show"); },"image/png");
}
function wrap(x,t,font,maxW){
  x.font=font; var out=[],c="";
  for(var i=0;i<t.length;i++){
    if(x.measureText(c+t[i]).width>maxW){out.push(c);c=t[i];}else c+=t[i];
  }
  if(c)out.push(c); return out;
}
function rrect(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath();}
var lastBlob=null;

function copyText(t){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(function(){toast("已复制，去微信粘贴");},function(){fallbackCopy(t);});
  }else fallbackCopy(t);
  function fallbackCopy(t){
    var ta=document.createElement("textarea"); ta.value=t; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try{document.execCommand("copy"); toast("已复制，去微信粘贴");}catch(e){toast("复制失败，请手动选择");}
    document.body.removeChild(ta);
  }
}
$("btnExport").addEventListener("click",function(){
  if(!monItems(curMon).length){toast("这个月还没有记录");return;}
  exportDay();
});
$("btnText").addEventListener("click",function(){ copyText(textOf()); });
$("ovClose").addEventListener("click",function(){$("ov").classList.remove("show");});
$("ovShare").addEventListener("click",function(){
  if(!lastBlob)return;
  var f=new File([lastBlob],"护肤消费-"+curMon+".png",{type:"image/png"});
  if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f]}).catch(function(){});}
  else{
    var a=document.createElement("a"); a.href=URL.createObjectURL(lastBlob); a.download="护肤消费-"+curMon+".png";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  }
});

applyTheme(TH);
renderPhoto();
var moved=migrateFromSpend();
/* 老版本遗留的字段已不再使用，顺手清掉 */
(function(){
  var dirty=false;
  D.items.forEach(function(it){
    if(it.state!==undefined){delete it.state;dirty=true;}
    if(it.rebuy!==undefined){delete it.rebuy;dirty=true;}
  });
  if(dirty) save();
})();
render();
if(moved>0){ toast("已从当日消费移入 "+moved+" 笔美妆护肤记录"); }
</script>

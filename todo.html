<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="想做的事">
<meta name="theme-color" content="#EEF3F8">
<title>想做的事</title>
<style>
:root{
  --ink:#3A3630; --ink2:#4A443C; --muted:#5C574E;
  --accent:#703D2D; --line:#D8CCB8; --border:#E4DCCF;
  --paper:#FFFFFF; --bg:#F6F2EA; --soft:#FBF8F2;
  --ok:#5E7050; --ph:#B7AC97; --chk:#B8A88A; --warn:#A33B22;
  --badgeA:#F3E4DE; --badgeB:#E7EDE2; --badgeC:#EDEAE4;
}
html[data-theme="blue"]{
  --ink:#2F3A46; --ink2:#42505D; --muted:#61707F;
  --accent:#2C5F92; --line:#BCCFE2; --border:#D2DFEC;
  --paper:#FFFFFF; --bg:#EEF3F8; --soft:#F5F9FD;
  --ok:#4A7358; --ph:#9FB0C0; --chk:#9DB2C6; --warn:#A8452E;
  --badgeA:#DFE9F3; --badgeB:#E3EEE6; --badgeC:#E8EBEF;
}
html[data-theme="green"]{
  --ink:#2E3A2E; --ink2:#42533F; --muted:#5F7060;
  --accent:#3F6B45; --line:#B6CDAE; --border:#CEDDC8;
  --paper:#FFFFFF; --bg:#EDF3EC; --soft:#F5FAF4;
  --ok:#4A7358; --ph:#A3B69D; --chk:#A2BCA0; --warn:#A8452E;
  --badgeA:#E2EDE1; --badgeB:#E7EDE2; --badgeC:#EDEAE4;
}
.themes{display:flex; gap:6px; justify-content:center; margin-top:10px;}
.themes button{
  font-family:inherit; font-size:12px; padding:5px 16px; border-radius:20px;
  border:1px solid var(--border); background:var(--paper); color:var(--muted); letter-spacing:.1em;
}
.themes button.on{background:var(--accent); color:#fff; border-color:var(--accent);}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Songti SC","STSongti-SC-Regular","Noto Serif SC","Songti TC",serif;
  padding:12px 14px calc(28px + env(safe-area-inset-bottom));
  max-width:520px; margin:0 auto; -webkit-font-smoothing:antialiased;
}
.head{text-align:center; padding:6px 0 2px;}
.head .kicker{font-size:12px; letter-spacing:.35em; color:var(--muted);}
.head h1{font-size:26px; margin:6px 0 2px; font-weight:700; letter-spacing:.12em;}
.head .sub{font-size:13px; color:var(--muted); line-height:1.7;}
.card{background:var(--paper); border:1.5px solid var(--border); border-radius:14px; padding:18px 16px 16px; margin-top:12px;}
.sec{margin-top:14px;} .sec:first-child{margin-top:0;}
label.lab{display:block; font-size:13px; color:var(--ink2); margin:0 0 6px 2px;}
input[type=text],input[type=number],input[type=date],textarea{
  width:100%; font-size:16px; font-family:inherit; color:var(--ink);
  background:var(--soft); border:none; border-bottom:1.5px solid var(--line);
  border-radius:6px 6px 0 0; padding:9px 10px 8px; outline:none; -webkit-appearance:none; appearance:none;
}
input:focus,textarea:focus{border-bottom-color:var(--accent); background:#fff;}
input::placeholder,textarea::placeholder{color:var(--ph);}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
/* 分类 */
.cats{display:grid; grid-template-columns:repeat(5,1fr); gap:7px;}
.cats button{font-family:inherit; font-size:14px; padding:10px 2px; border-radius:9px;
  border:1.5px solid var(--line); background:var(--soft); color:var(--ink2);}
.cats button.on{background:var(--accent); border-color:var(--accent); color:#fff;}
/* 星级 */
.stars{display:flex; gap:8px;}
.stars button{flex:1; font-family:inherit; font-size:17px; padding:10px 0; border-radius:9px;
  border:1.5px solid var(--line); background:var(--soft); color:var(--ph);}
.stars button.on{color:var(--accent); border-color:var(--accent); background:var(--badgeA);}
.actions{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px;}
.actions button{font-family:inherit; font-size:15px; letter-spacing:.06em; padding:12px 6px; border-radius:10px; border:1.5px solid var(--accent);}
#btnAdd{background:var(--accent); color:#fff;}
#btnClear{background:#fff; color:var(--accent);}
/* 小结 */
.total{margin-top:14px; background:var(--soft); border:1px solid var(--border); border-radius:12px; padding:14px 14px 10px;}
.total .lab2{font-size:12.5px; color:var(--muted); letter-spacing:.15em;}
.total .num{font-size:34px; font-weight:700; color:var(--accent); line-height:1.3; margin-top:2px;}
.total .cnt{font-size:12px; color:var(--muted);}
/* 列表 */
.listTitle{display:flex; justify-content:space-between; align-items:center; margin-top:18px; font-size:14px; color:var(--ink2); letter-spacing:.1em;}
.listTitle .c{font-size:12.5px; color:var(--muted);}
.group .gt{font-size:13px; color:var(--accent); letter-spacing:.15em; margin:14px 0 4px;}
.group:first-child .gt{margin-top:2px;}
.item{display:flex; gap:12px; padding:12px 0; border-bottom:1px dashed var(--border); align-items:flex-start;}
.item .dot{flex:0 0 30px; height:30px; border-radius:50%; border:2px solid var(--chk); margin-top:2px;
  display:flex; align-items:center; justify-content:center; font-size:16px; color:transparent;}
.item.done .dot{border-color:var(--ok); background:var(--ok); color:#fff;}
.item.drop .dot{border-color:var(--ph); color:var(--ph); background:var(--soft);}
.item.doing .dot{border-color:var(--accent); background:var(--accent); color:#fff;}
.item .info{flex:1; min-width:0;}
.item .info .n{font-size:15.5px; color:var(--ink); line-height:1.6;}
.item.done .info .n{text-decoration:line-through; text-decoration-color:var(--chk); color:var(--muted);}
.item .info .m{font-size:11.5px; color:var(--muted); margin-top:4px; line-height:1.8;}
.item .info .m i{font-style:normal; color:var(--accent); background:var(--badgeA); padding:1px 7px; border-radius:20px; margin-right:6px;}
.item .ops{flex:0 0 auto; display:flex; flex-direction:column; gap:6px; align-items:flex-end;}
.item .ops button{font-family:inherit; font-size:11.5px; padding:5px 9px; border-radius:7px;
  border:1px solid var(--line); background:#fff; color:var(--ink2);}
.item .ops .del{border-color:var(--border); color:var(--ph);}
.empty{font-size:12.5px; color:var(--ph); padding:14px 2px; text-align:center;}
.quote{text-align:center; font-size:12.5px; color:var(--muted); margin:16px 0 2px;}
.nav{display:flex; justify-content:center; gap:14px; flex-wrap:wrap; margin-top:6px; flex-wrap:wrap;}
.nav a{font-size:14px; color:var(--accent); text-decoration:none; padding:9px 14px;
  border:1px solid var(--border); border-radius:22px; background:var(--paper);
  font-family:inherit; letter-spacing:.02em; -webkit-tap-highlight-color:transparent;}
.nav a:active{background:var(--soft);}
/* 预览层 */
#ov{position:fixed; inset:0; background:rgba(40,35,28,.72); z-index:50; display:none; flex-direction:column;
  align-items:center; justify-content:center; padding:18px;}
#ov.show{display:flex;}
#ov img{max-width:100%; max-height:62vh; border-radius:10px; box-shadow:0 8px 30px rgba(0,0,0,.4);}
#ov .tip{color:#F1E9DA; font-size:13px; margin:12px 0 10px; text-align:center; line-height:1.7;}
#ov .row{display:flex; gap:10px;}
#ov button{font-family:inherit; font-size:14px; padding:10px 18px; border-radius:9px; border:none;}
#ovShare,#ovCopy{background:#fff; color:var(--ink);}
#ovClose{background:transparent; color:#F1E9DA; border:1px solid #8C8272 !important;}
.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:34px; background:rgba(58,54,48,.92); color:#F6F2EA;
  font-size:13px; padding:10px 16px; border-radius:9px; opacity:0; transition:opacity .25s; z-index:99; pointer-events:none;}
.toast.show{opacity:1;}
</style>
</head>
<body>

<div class="head">
  <div class="kicker">CALME · 愿望清单</div>
  <h1>想 做 的 事</h1>
  <div class="sub">想去的地方、想学的东西、想见的人，<br>先记下来，一件件去完成。</div>
  <div class="themes" id="themes">
    <button data-t="warm" type="button">米</button><button data-t="blue" type="button">蓝</button><button data-t="green" type="button">绿</button>
  </div>
</div>
<div class="nav"><a href="index.html">心愿卡</a><a href="spend.html">当日消费</a><a href="record.html">种草记录</a><a href="food.html">每日饮食</a><a href="research.html">当日科研</a><a href="backup.html">数据备份</a></div>

<div class="card">
  <div class="sec">
    <label class="lab" for="fTitle">想做什么</label>
    <input type="text" id="fTitle" placeholder="去洱海骑行一圈">
  </div>

  <div class="sec">
    <label class="lab">分类</label>
    <div class="cats" id="cats">
      <button data-v="想去" type="button">想去</button>
      <button data-v="想学" type="button">想学</button>
      <button data-v="想试" type="button">想试</button>
      <button data-v="想见" type="button">想见</button>
      <button data-v="其他" type="button">其他</button>
    </div>
  </div>

  <div class="sec">
    <label class="lab">有多想做</label>
    <div class="stars" id="stars">
      <button data-v="1" type="button">★</button>
      <button data-v="2" type="button">★★</button>
      <button data-v="3" type="button">★★★</button>
      <button data-v="4" type="button">★★★★</button>
      <button data-v="5" type="button">★★★★★</button>
    </div>
  </div>

  <div class="sec grid2">
    <div>
      <label class="lab" for="fPlan">计划时间（可不填）</label>
      <input type="date" id="fPlan">
    </div>
    <div>
      <label class="lab" for="fNote">备注（可不填）</label>
      <input type="text" id="fNote" placeholder="和谁 / 大概什么时候">
    </div>
  </div>

  <div class="actions">
    <button id="btnAdd" type="button">加一条</button>
    <button id="btnClear" type="button">清空输入</button>
  </div>
</div>

<div class="card">
  <div class="total">
    <div class="lab2">清 单 概 况</div>
    <div class="num" id="sum">0 件</div>
    <div class="cnt" id="cnt"></div>
  </div>
</div>

<div class="listTitle">
  <span>清单</span>
  <span class="c" id="listCount"></span>
</div>
<div class="card" id="listCard">
  <div id="list"></div>
</div>

<div class="card">
  <div class="actions" style="margin-top:0; grid-template-columns:1fr;">
    <button id="btnExport" type="button" style="background:var(--accent); color:#fff;">生成清单图片</button>
  </div>
  <div class="actions" style="grid-template-columns:1fr;">
    <button id="btnText" type="button" style="background:#fff; color:var(--accent);">复制文字版</button>
  </div>
</div>

<div class="quote">想，全是问题；做，才有答案。</div>
<div class="nav"><a href="index.html">心愿卡</a><a href="spend.html">当日消费</a><a href="record.html">种草记录</a><a href="food.html">每日饮食</a><a href="research.html">当日科研</a><a href="backup.html">数据备份</a></div>

<div id="ov">
  <img id="ovImg" alt="想做的事清单图片">
  <div class="tip">长按图片 → 存入照片 / 发给闺蜜</div>
  <div class="row">
    <button id="ovShare" type="button">分享…</button>
    <button id="ovClose" type="button">关闭</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
var LS="calme_todo_v1";
var $=function(id){return document.getElementById(id);};
function load(){try{var s=JSON.parse(localStorage.getItem(LS));if(s&&s.items)return s;}catch(e){}return {items:[]};}
function save(){localStorage.setItem(LS,JSON.stringify(D));}
var D=load();

/* ---------- 配色（米 / 蓝 / 绿） ---------- */
var THEMES={
  warm:{bg:"#F6F2EA",paper:"#FFFFFF",border:"#E4DCCF",line:"#D8CCB8",
        ink:"#3A3630",ink2:"#4A443C",muted:"#5C574E",accent:"#703D2D",chk:"#B8A88A",ph:"#C9BFA9"},
  blue:{bg:"#EEF3F8",paper:"#FFFFFF",border:"#D2DFEC",line:"#BCCFE2",
        ink:"#2F3A46",ink2:"#42505D",muted:"#61707F",accent:"#2C5F92",chk:"#9DB2C6",ph:"#A8B8C7"},
  green:{bg:"#EDF3EC",paper:"#FFFFFF",border:"#CEDDC8",line:"#B6CDAE",
        ink:"#2E3A2E",ink2:"#42533F",muted:"#5F7060",accent:"#3F6B45",chk:"#A2BCA0",ph:"#A8BCA2"}
};
var TH="blue";
try{ if(localStorage.getItem("calme_theme2")) TH=localStorage.getItem("calme_theme2"); }catch(e){}
function applyTheme(t){
  TH=t; try{localStorage.setItem("calme_theme2",t);}catch(e){}
  document.documentElement.setAttribute("data-theme",t==="warm"?"":t);
  document.querySelectorAll("#themes button").forEach(function(b){b.classList.toggle("on",b.dataset.t===t);});
}

var CATS=["想去","想学","想试","想见","其他"];
var STATUS=["want","doing","done","drop"];
var ST_LABEL={want:"想做",doing:"进行中",done:"已完成",drop:"放弃"};
var ST_NEXT={want:["doing","drop"],doing:["done","drop"],done:["want"],drop:["want"]};
var ST_ACT={want:"开始做",doing:"完成了",done:"再来一次",drop:"捡回来"};
var cur={title:"",cat:"想去",stars:3,plan:"",note:""};
function today(){var d=new Date(),p=function(n){return (n<10?"0":"")+n;};return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());}
function num(v){var n=parseFloat(v);return isNaN(n)?0:n;}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function toast(t){var el=$("toast");el.textContent=t;el.classList.add("show");setTimeout(function(){el.classList.remove("show");},1800);}

/* ---------- 输入 ---------- */
$("fTitle").addEventListener("input",function(){cur.title=$("fTitle").value;});
$("fPlan").addEventListener("input",function(){cur.plan=$("fPlan").value;});
$("fNote").addEventListener("input",function(){cur.note=$("fNote").value;});
$("cats").addEventListener("click",function(e){
  var b=e.target.closest("button"); if(!b)return; cur.cat=b.dataset.v; renderCats();
});
$("stars").addEventListener("click",function(e){
  var b=e.target.closest("button"); if(!b)return; cur.stars=num(b.dataset.v)||3; renderStars();
});
function renderCats(){
  document.querySelectorAll("#cats button").forEach(function(b){b.classList.toggle("on",b.dataset.v===cur.cat);});
}
function renderStars(){
  document.querySelectorAll("#stars button").forEach(function(b){b.classList.toggle("on",num(b.dataset.v)<=cur.stars);});
}

/* ---------- 保存 ---------- */
$("btnAdd").addEventListener("click",function(){
  if(!cur.title.trim()){toast("先写一件想做的事");$("fTitle").focus();return;}
  D.items.push({id:Date.now(),title:cur.title.trim(),cat:cur.cat,stars:cur.stars,
    plan:cur.plan||"",note:cur.note||"",status:"want",created:Date.now()});
  save();
  cur.title=""; cur.plan=""; cur.note="";
  $("fTitle").value=""; $("fPlan").value=""; $("fNote").value="";
  render(); toast("已加入清单");
});
$("btnClear").addEventListener("click",function(){
  cur.title=""; cur.plan=""; cur.note="";
  $("fTitle").value=""; $("fPlan").value=""; $("fNote").value="";
});

/* ---------- 列表 ---------- */
function render(){
  renderCats(); renderStars();
  var n=D.items.length;
  var done=D.items.filter(function(it){return it.status==="done";}).length;
  var doing=D.items.filter(function(it){return it.status==="doing";}).length;
  $("sum").textContent=n+" 件";
  $("cnt").textContent=n?("已完成 "+done+" · 进行中 "+doing+" · 还剩 "+(n-done)+" 件"):"清单还空着，先加一件想做的事";
  $("listCount").textContent=n?("共 "+n+" 件"):"";

  var L=$("list");
  if(!n){L.innerHTML='<div class="empty">还没有条目。想，就写下来。</div>';return;}
  var h="";
  ["doing","want","done","drop"].forEach(function(st){
    var g=D.items.filter(function(it){return it.status===st;})
      .sort(function(a,b){return (b.stars-a.stars)||(a.created-b.created);});
    if(!g.length)return;
    h+='<div class="group"><div class="gt">'+ST_LABEL[st]+'（'+g.length+'）</div>';
    g.forEach(function(it){
      var idx=D.items.indexOf(it);
      var meta='<i>'+esc(it.cat)+'</i>';
      if(it.stars) meta+='<span style="color:var(--accent); letter-spacing:1px;">'+
        "★★★★★".slice(0,it.stars)+"☆☆☆☆☆".slice(0,5-it.stars)+"</span>";
      if(it.plan) meta+=' · 计划 '+esc(it.plan);
      var dots=ST_NEXT[it.status].map(function(ns){
        return '<button data-i="'+idx+'" data-to="'+ns+'">'+ST_ACT[ns]+'</button>';
      }).join("");
      h+='<div class="item '+st+'">'+
        '<span class="dot">'+(st==="done"?"✓":(st==="drop"?"×":(st==="doing"?"…":"")))+'</span>'+
        '<div class="info"><div class="n">'+esc(it.title)+'</div><div class="m">'+meta+
        (it.note?'<br>'+esc(it.note):'')+'</div></div>'+
        '<div class="ops">'+dots+'<button class="del" data-i="'+idx+'">删</button></div>'+
        '</div>';
    });
    h+='</div>';
  });
  L.innerHTML=h;
}
$("list").addEventListener("click",function(e){
  var b=e.target.closest("button"); if(!b)return;
  var i=+b.dataset.i;
  if(b.classList.contains("del")){
    if(!confirm("删除这一条？"))return;
    D.items.splice(i,1); save(); render(); return;
  }
  if(b.dataset.to){ D.items[i].status=b.dataset.to; save(); render();
    toast("已标记为「"+ST_LABEL[b.dataset.to]+"」"); }
});

/* ---------- 文字版 ---------- */
function textOf(){
  var n=D.items.length;
  var done=D.items.filter(function(it){return it.status==="done";}).length;
  var L=[];
  L.push("想做的事 · "+today());
  L.push("共 "+n+" 件，已完成 "+done+" 件");
  ["doing","want","done","drop"].forEach(function(st){
    var g=D.items.filter(function(it){return it.status===st;})
      .sort(function(a,b){return (b.stars-a.stars)||(a.created-b.created);});
    if(!g.length)return;
    L.push("—— "+ST_LABEL[st]+" ——");
    g.forEach(function(it){
      L.push("★".repeat(it.stars)+" "+it.title+"（"+it.cat+"）"+
        (it.plan?" · 计划 "+it.plan:"")+(it.note?" · "+it.note:""));
    });
  });
  return L.join("\n");
}
function copyText(t){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(function(){toast("已复制，去微信粘贴");},function(){fallbackCopy(t);});
  }else fallbackCopy(t);
  function fallbackCopy(t){
    var ta=document.createElement("textarea"); ta.value=t; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try{document.execCommand("copy"); toast("已复制，去微信粘贴");}catch(e){toast("复制失败，请手动选择");}
    document.body.removeChild(ta);
  }
}
$("btnText").addEventListener("click",function(){ copyText(textOf()); });

/* ---------- 生成卡片图片 ---------- */
function wrap(x,t,font,maxW){
  x.font=font; var out=[],c="";
  for(var i=0;i<t.length;i++){
    if(x.measureText(c+t[i]).width>maxW){out.push(c);c=t[i];}else c+=t[i];
  }
  if(c)out.push(c); return out;
}
function rrect(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath();}
var lastBlob=null;

function exportImg(){
  var n=D.items.length;
  var done=D.items.filter(function(it){return it.status==="done";}).length;
  var W=1080, CX=60, CY=60, M=CX+44, IW=W-M*2;
  var SER='"Songti SC","STSongti-SC-Regular","Noto Serif SC",serif';
  var cv=document.createElement("canvas"); cv.width=W; cv.height=2600;
  var mx=cv.getContext("2d");

  var rows=[];
  ["doing","want","done","drop"].forEach(function(st){
    var g=D.items.filter(function(it){return it.status===st;})
      .sort(function(a,b){return (b.stars-a.stars)||(a.created-b.created);});
    if(!g.length)return;
    var lines=g.map(function(it){
      mx.font="28px "+SER;
      var meta=it.cat+(it.plan?" · "+it.plan:"");
      return {it:it,tl:wrap(mx,it.title,"28px "+SER,IW-110-60).slice(0,2),meta:meta};
    });
    rows.push({st:st,lines:lines});
  });
  var bodyH=0;
  rows.forEach(function(r){ bodyH+=56+r.lines.reduce(function(a,l){return a+Math.max(1,l.tl.length)*44+34;},0); });
  var H=Math.max(1080, 440+bodyH+120);
  cv.height=H;
  var P=THEMES[TH]||THEMES.warm;
  var ink=P.ink, mut=P.muted, acc=P.accent, line=P.line, brd=P.border;
  var x=cv.getContext("2d");

  x.fillStyle=P.bg; x.fillRect(0,0,W,H);
  x.save(); x.shadowColor="rgba(0,0,0,.10)"; x.shadowBlur=24; x.shadowOffsetY=6;
  x.fillStyle="#FFFFFF"; rrect(x,CX,CY,W-120,H-120,24); x.fill(); x.restore();
  x.strokeStyle=brd; x.lineWidth=2; rrect(x,CX,CY,W-120,H-120,24); x.stroke();

  var y=CY+104;
  x.fillStyle=ink; x.font="700 58px "+SER; x.textAlign="center"; x.fillText("想 做 的 事",W/2,y); x.textAlign="left";
  y+=52;
  x.fillStyle=mut; x.font="26px "+SER; x.textAlign="center";
  x.fillText("共 "+n+" 件 · 已完成 "+done+" 件",W/2,y); x.textAlign="left";
  y+=64;

  if(!rows.length){
    x.fillStyle=P.ph; x.font="28px "+SER; x.textAlign="center";
    x.fillText("清单还空着",W/2,y+40); x.textAlign="left";
  }
  rows.forEach(function(r){
    x.fillStyle=acc; x.font="700 30px "+SER; x.fillText(ST_LABEL[r.st],M,y);
    x.strokeStyle=line; x.lineWidth=1.5;
    x.beginPath(); x.moveTo(M+x.measureText(ST_LABEL[r.st]).width+20,y-10); x.lineTo(M+IW,y-10); x.stroke();
    y+=48;
    r.lines.forEach(function(l){
      var st=r.st;
      var cx=M+16, cy=y-10;
      if(st==="done"){ x.fillStyle=P.ok||"#4A7358"; x.globalAlpha=.9; rrect(x,cx-14,cy-14,28,28,14); x.fill(); x.globalAlpha=1;
        x.fillStyle="#fff"; x.font="700 22px "+SER; x.textAlign="center"; x.fillText("✓",cx,cy+1); x.textAlign="left"; }
      else if(st==="doing"){ x.fillStyle=acc; x.globalAlpha=.9; rrect(x,cx-14,cy-14,28,28,14); x.fill(); x.globalAlpha=1;
        x.fillStyle="#fff"; x.font="700 18px "+SER; x.textAlign="center"; x.fillText("…",cx,cy+1); x.textAlign="left"; }
      else if(st==="drop"){ x.strokeStyle=P.ph; x.lineWidth=2; x.beginPath(); x.arc(cx,cy,14,0,Math.PI*2); x.stroke();
        x.fillStyle=P.ph; x.font="22px "+SER; x.textAlign="center"; x.fillText("×",cx,cy+1); x.textAlign="left"; }
      else { x.strokeStyle=P.chk; x.lineWidth=2; x.beginPath(); x.arc(cx,cy,14,0,Math.PI*2); x.stroke(); }

      x.fillStyle=st==="done"?mut:ink;
      if(st==="done"||st==="drop") x.globalAlpha=.75;
      l.tl.forEach(function(ln,j){ x.font="28px "+SER; x.fillText(ln,M+52,y+j*40); });
      if(l.tl.length>1) y+=(l.tl.length-1)*40;
      x.globalAlpha=1;
      x.fillStyle=mut; x.font="22px "+SER;
      x.fillText("★".repeat(l.it.stars)+"　"+l.meta,M+52,y+34);
      y+=Math.max(1,l.tl.length)*44+34;
    });
    y+=8;
  });

  x.fillStyle=P.ph; x.font="22px "+SER; x.textAlign="center";
  x.fillText("Calme · 想做的事　"+today(),W/2,H-CY-40); x.textAlign="left";

  lastBlob=null;
  cv.toBlob(function(b){ lastBlob=b; $("ovImg").src=URL.createObjectURL(b); $("ov").classList.add("show"); },"image/png");
}

$("btnExport").addEventListener("click",function(){
  if(!D.items.length){toast("清单还空着");return;}
  exportImg();
});
$("ovClose").addEventListener("click",function(){$("ov").classList.remove("show");});
$("ovShare").addEventListener("click",function(){
  if(!lastBlob)return;
  var f=new File([lastBlob],"想做的事.png",{type:"image/png"});
  if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f]}).catch(function(){});}
  else{
    var a=document.createElement("a"); a.href=URL.createObjectURL(lastBlob); a.download="想做的事.png";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  }
});

document.getElementById("themes").addEventListener("click",function(e){
  var b=e.target.closest("button"); if(!b)return; applyTheme(b.dataset.t);
});
applyTheme(TH);

render();
</script>
</body>
</html>
